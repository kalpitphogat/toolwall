name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # No torch here: the suite uses StubScorer, so CI checks data pipeline, metrics,
      # policy, audit store, API and the gateway end to end without model weights.
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -v
