[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "toolwall"
version = "0.1.0"
description = "MCP security gateway that scans agent tool outputs for indirect prompt injection using a classifier trained on leak-free splits."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "pydantic>=2.7",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "mcp>=2.3,<3",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
model = ["torch>=2.4", "transformers>=4.56", "sentencepiece>=0.2", "protobuf>=4.25"]
data = ["datasets>=3.0"]
dev = ["pytest>=8.0", "httpx>=0.27", "scikit-learn>=1.5"]

[project.scripts]
toolwall = "toolwall.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/toolwall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
